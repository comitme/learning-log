name: Refresh entry index

on:
  push:
    branches: [main]
    paths: ["entries/**", "scripts/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index, stats and progress card
        run: python scripts/update_index.py
      - name: Commit the updated files
        run: |
          git config user.name "learning-log-bot"
          git config user.email "learning-log-bot@users.noreply.github.com"
          git add README.md assets/card.svg
          git diff --cached --quiet || (git commit -m "Refresh entry index" && git push)